# Dedizierter Singleton-Worker (APScheduler, Node-Heartbeats, Task-/AI-Pumpen).
# Darf immer nur einmal laufen (`replicas: 1`, `Recreate`). Die horizontale
# Skalierung fuer HTTP/WebSockets uebernimmt separat das `msm-panel` Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msm-worker
  namespace: msm
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msm-worker
  namespace: msm
  labels:
    app.kubernetes.io/name: msm
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: msm
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msm
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: msm-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dis-sidecar
          image: ghcr.io/mauntingstudios/msm-dis-sidecar:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: MSM_DIS_SIDECAR_PORT
              value: "9100"
            - name: MSM_DIS_SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SIDECAR_TOKEN
            - name: MSM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_SECRET_KEY
            - name: MSM_DIS_SALT
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SALT
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 20

        - name: worker
          image: ghcr.io/mauntingstudios/msm-panel:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "worker.py"]
          envFrom:
            - configMapRef:
                name: msm-config
          env:
            - name: MSM_WORKER_MODE
              value: "worker"
            - name: MSM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_SECRET_KEY
            - name: MSM_DIS_SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SIDECAR_TOKEN
            - name: MSM_DIS_SALT
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SALT
            - name: MSM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DATABASE_URL
            - name: MSM_DATABASE_URL_ASYNC
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DATABASE_URL_ASYNC
            - name: MSM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_REDIS_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          volumeMounts:
            - name: panel-data
              mountPath: /opt/msm
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: panel-data
          persistentVolumeClaim:
            claimName: msm-panel-data
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
