# Internes Redis fuer Backplane-Pub/Sub, Distributed Locks und Rate-Limiting.
# Erforderlich fuer Multi-Worker-Betrieb (`msm-panel` >= 2 Replicas + `msm-worker`).
apiVersion: v1
kind: Service
metadata:
  name: msm-redis
  namespace: msm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: msm
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msm-redis
  namespace: msm
  labels:
    app.kubernetes.io/name: msm
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: msm
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msm
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - >
              exec redis-server
              --bind 0.0.0.0
              --port 6379
              --protected-mode yes
              --requirepass "$MSM_REDIS_PASSWORD"
              --maxmemory 256mb
              --maxmemory-policy allkeys-lru
              --rename-command FLUSHALL ""
              --rename-command FLUSHDB ""
              --rename-command CONFIG ""
              --rename-command SHUTDOWN ""
              --rename-command DEBUG ""
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: MSM_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "320Mi"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$MSM_REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$MSM_REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
