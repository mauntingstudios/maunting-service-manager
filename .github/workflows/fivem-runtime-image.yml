name: Publish FiveM runtime image

on:
  push:
    branches: ["main", "refactor/v6.1-critical-cleanup"]
    paths:
      - "containers/fivem-runtime/**"
      - ".github/workflows/fivem-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fivem-runtime-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/msm-fivem-runtime
  STABLE_TAG: build-38435

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned FiveM runtime
        uses: docker/build-push-action@v6
        with:
          context: containers/fivem-runtime
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.STABLE_TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
